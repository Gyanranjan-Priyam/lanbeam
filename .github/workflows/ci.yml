name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core-test:
    name: Core Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.24.x"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: core/go.mod

      - name: Go vet
        run: |
          cd core
          go vet ./...

      - name: Run Go tests
        run: |
          cd core
          go test -v ./...

      - name: Run Go tests with race detector (Linux & macOS)
        if: runner.os != 'Windows'
        run: |
          cd core
          go test -v -race ./...

      - name: Build Go binary
        run: |
          cd core
          go build -v -o lanbeam ./cmd/lanbeam

  web-and-protocol:
    name: Web (Next.js) & Protocol Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Verify Protocol code generation
        run: |
          bun run --cwd packages/protocol generate
          git diff --exit-code packages/protocol/src/schema.d.ts

      - name: Typecheck Protocol
        run: bun run --cwd packages/protocol check-types

      - name: Run Vitest tests
        run: bun run --cwd apps/share test

      - name: Typecheck Share App
        run: bun run --cwd apps/share check-types

      - name: Build Share App (Next.js Export)
        run: bun run --cwd apps/share build
