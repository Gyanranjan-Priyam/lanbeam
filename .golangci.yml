run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused
    - gosec
    - misspell
    - unconvert
    - revive

issues:
  exclude-dirs:
    - "node_modules"
    - "apps/ui/dist"
    - "apps/ui/dist-guest"
  exclude-rules:
    - path: ".*\\.gen\\.go"
      linters:
        - errcheck
        - revive
        - gosec
